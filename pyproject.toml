[project]
name = "profilelab"
version = "0.1.0"
description = "What's My Profile — measure the profile of yourself that exists outside your control, in bits"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "matplotlib>=3.9",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
wmp = "profilelab.cli:app"
wmp-mcp = "profilelab.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profilelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
